<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TvTray</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 16px 20px 40px; }
  h2 { font-size: 16px; margin: 22px 0 10px; }
  h2:first-child { margin-top: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .form { display: grid; grid-template-columns: 220px 1fr; gap: 8px 14px; align-items: center; }
  .form .full { grid-column: 1 / -1; }
  .form input[type=number] { width: 90px; }
  .form input[type=text] { width: 100%; }
  .tv-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .tv-head input { font-weight: 600; flex: 1; }
  .meta { font-size: 12px; color: var(--muted); margin: -6px 0 12px 19px; }
  details { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  .help { font-size: 12px; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 400; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  code { font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>

<h2 data-i18n="set.tvs"></h2>
<div class="card">
  <div class="row">
    <button class="primary" id="scan" data-i18n="set.scan"></button>
    <span class="muted small" id="scanStatus" data-i18n="set.scanHint"></span>
  </div>
  <div id="scanResults"></div>
</div>
<div id="tvs"></div>

<h2 data-i18n="gen.title"></h2>
<div class="card form">
  <span data-i18n="gen.language"></span>
  <select id="language" style="width: 200px"></select>
  <span data-i18n="gen.offDelay"></span>
  <span class="row"><input type="number" id="offDelay" min="0" max="600"><span class="help" data-i18n="gen.offDelayHelp"></span></span>
  <span data-i18n="gen.wake"></span>
  <span class="row"><input type="number" id="wakeTimeout" min="5" max="300"><span class="help" data-i18n="gen.wakeHelp"></span></span>
  <span data-i18n="gen.autostart"></span>
  <label class="check"><input type="checkbox" id="autostart"> <span data-i18n="gen.autostartLabel"></span></label>
  <span data-i18n="gen.version"></span>
  <span><span id="version"></span> · <a href="#" id="repo" style="color:var(--accent)">GitHub</a></span>
  <span data-i18n="gen.ini"></span>
  <code id="ini"></code>
  <span></span>
  <div class="actions"><button class="danger" id="uninstall" data-i18n="gen.uninstall"></button><button id="quit" data-i18n="gen.quit"></button></div>
</div>

<script type="module">
import { tv, Events, $, el, safe, toast, debounce } from "/common.js";
import { keySeqField } from "/keyseq.js";
import { t as tr, initI18n, LANGUAGES } from "/i18n.js";

await initI18n(() => tv("Language"));
document.title = tr("set.title");

let state = null;

const num = (v, d) => Number.isFinite(+v) && v !== "" ? +v : d;
const keysText = a => (a || []).join(", ");

function tvCard(t, online) {
  const save = debounce(() => safe(async () => { await tv("SaveTV", t); }), 300);
  const bind = (input, get, set) => {
    get(input);
    input.addEventListener(input.type === "checkbox" || input.tagName === "SELECT" ? "change" : "input", () => { set(input); save(); });
    return input;
  };
  const text = (get, set) => bind(el("input", { type: "text" }), i => i.value = get(), i => set(i.value));
  const number = (get, set, min, max) => bind(el("input", { type: "number", min, max }), i => i.value = get(), i => set(num(i.value, get())));
  const check = (label, get, set) => el("label", { class: "check" },
    bind(el("input", { type: "checkbox" }), i => i.checked = get(), i => set(i.checked)), label);

  const b = t.backlight;
  const blCurrent = number(() => b.current, v => b.current = v, -1, 100);

  const card = el("div", { class: "card" },
    el("div", { class: "tv-head" },
      el("span", { class: "dot" + (online ? " on" : ""), title: tr(online ? "status.on" : "status.offline") }),
      text(() => t.name, v => t.name = v),
      el("button", { class: "danger", onclick: () => safe(async () => {
        if (!confirm(tr("set.removeConfirm", { name: t.name }))) return;
        await tv("RemoveTV", t.mac); load();
      }) }, tr("set.remove"))),
    el("div", { class: "meta" }, `${t.model} · IP ${t.ip} · MAC ${t.mac}`),

    el("div", { class: "form" },
      el("span", {}, tr("set.power")),
      check(tr("set.linkPower"), () => t.linkPower, v => t.linkPower = v),
      el("span", {}, tr("set.panel")),
      check(tr("set.showInPanel"), () => t.showInPanel, v => t.showInPanel = v),
      el("span", {}, tr("set.volume")),
      bind(el("select", {},
        el("option", { value: "upnp" }, tr("set.volUpnp")),
        el("option", { value: "keys" }, tr("set.volKeys"))),
        i => i.value = t.volumeMode, i => t.volumeMode = i.value),
    ),

    el("details", { open: !b.enabled ? false : undefined },
      el("summary", {}, tr("bl.title")),
      el("p", { class: "help" }, tr("bl.help")),
      el("div", { class: "form" },
        el("span", {}, tr("bl.preset")),
        presetRow(t),
        el("span", {}, tr("bl.enable")),
        check(tr("bl.showSlider"), () => b.enabled, v => b.enabled = v),
        el("span", {}, tr("bl.open")),
        keySeqField({ mac: t.mac, get: () => b.openKeys || [], set: k => { b.openKeys = k; save(); } }),
        el("span", {}, tr("bl.close")),
        keySeqField({ mac: t.mac, get: () => b.closeKeys || [], set: k => { b.closeKeys = k; save(); } }),
        el("span", {}, tr("bl.max")),
        number(() => b.max, v => b.max = v, 1, 100),
        el("span", {}, tr("bl.navDelay")),
        number(() => b.navDelayMs, v => b.navDelayMs = v, 100, 5000),
        el("span", {}, tr("bl.stepDelay")),
        number(() => b.stepDelayMs, v => b.stepDelayMs = v, 30, 2000),
        el("span", {}, tr("bl.current")),
        el("span", { class: "row" }, blCurrent, el("span", { class: "help" }, tr("bl.currentHelp"))),
        el("span", {}, tr("bl.check")),
        el("div", { class: "actions" },
          el("button", { onclick: () => safe(() => tv("TestKeys", t.mac, keysText(b.openKeys))) }, tr("bl.testOpen")),
          el("button", { onclick: () => safe(() => tv("TestKeys", t.mac, "KEY_LEFT")) }, "◀"),
          el("button", { onclick: () => safe(() => tv("TestKeys", t.mac, "KEY_RIGHT")) }, "▶"),
          el("button", { onclick: () => safe(() => tv("TestKeys", t.mac, keysText(b.closeKeys))) }, tr("bl.testClose")),
          el("button", { onclick: () => safe(async () => {
            const v = prompt(tr("bl.syncPrompt", { max: b.max }), Math.max(0, b.current));
            if (v === null) return;
            await tv("SyncBacklight", t.mac, num(v, 0));
            toast(tr("bl.sent"));
          }) }, tr("bl.sync")),
        ),
      ),
    ),
  );
  return card;
}

// Preset picker: matching preset is preselected; GitHub refresh reloads the list.
function presetRow(t) {
  const select = el("select", { class: "grow" });
  const status = el("span", { class: "help" });
  const fill = async () => {
    const list = await tv("Presets", t.mac);
    const match = list.find(p => p.match);
    select.replaceChildren(
      el("option", { value: "" }, tr(list.length ? "bl.choose" : "bl.none")),
      ...list.map(p => el("option", { value: p.id, title: [...(p.models || []), p.pattern].filter(Boolean).join(", ") },
        p.name + (p.match ? "  " + tr("bl.forModel", { model: t.model }) : ""))));
    if (match) select.value = match.id;
    status.textContent = match ? "" : tr("bl.noMatch", { model: t.model });
  };
  const apply = el("button", { onclick: () => safe(async () => {
    if (!select.value) return;
    await tv("ApplyPreset", t.mac, select.value);
    toast(tr("bl.applied"));
    await load();
  }) }, tr("bl.apply"));
  const update = el("button", { title: tr("bl.updateTitle"), onclick: () => safe(async () => {
    update.disabled = true;
    try {
      const n = await tv("UpdatePresets");
      toast(tr("bl.downloaded", { n }));
      await fill();
    } finally { update.disabled = false; }
  }) }, tr("bl.update"));
  safe(fill);
  return el("div", { class: "row", style: "flex-wrap: wrap" }, select, apply, update, status);
}

function renderTVs() {
  const list = state.config.tvs || [];
  $("#tvs").replaceChildren(...(list.length ? list.map(t => tvCard(t, state.online[t.mac]))
    : [el("div", { class: "card muted" }, tr("set.noTVs"))]));
}

async function load() {
  state = await tv("Settings");
  const c = state.config;
  $("#offDelay").value = c.offDelaySec;
  $("#wakeTimeout").value = c.wakeTimeoutSec;
  $("#autostart").checked = c.autostart;
  $("#language").value = c.language || "";
  $("#ini").textContent = state.iniPath;
  $("#version").textContent = state.version;
  renderTVs();
}

const saveGeneral = debounce(() => safe(() =>
  tv("SaveGeneral", num($("#offDelay").value, 5), num($("#wakeTimeout").value, 40), $("#autostart").checked, $("#language").value)), 400);
["#offDelay", "#wakeTimeout"].forEach(s => $(s).addEventListener("input", saveGeneral));
$("#autostart").addEventListener("change", saveGeneral);
$("#language").replaceChildren(el("option", { value: "" }, tr("gen.system")), ...LANGUAGES.map(l => el("option", { value: l.code }, l.name)));
$("#language").addEventListener("change", saveGeneral);

$("#scan").onclick = () => safe(async () => {
  $("#scan").disabled = true;
  $("#scanStatus").textContent = tr("set.scanning");
  try {
    const found = await tv("Scan");
    $("#scanStatus").textContent = found.length ? tr("set.found", { n: found.length }) : tr("set.notFound");
    $("#scanResults").replaceChildren(found.length ? el("table", {},
      el("tr", {}, el("th", {}, tr("set.col.name")), el("th", {}, tr("set.col.model")), el("th", {}, "IP"), el("th", {}, "MAC"), el("th", {}, tr("set.col.net")), el("th", {})),
      found.map(f => el("tr", {},
        el("td", {}, f.name), el("td", {}, f.model), el("td", {}, f.ip), el("td", {}, el("code", {}, f.mac)),
        el("td", {}, f.net === "wireless" ? "Wi-Fi" : tr("set.cable")),
        el("td", {}, f.added ? el("span", { class: "muted small" }, tr("set.added"))
          : el("button", { onclick: e => safe(async () => { e.target.disabled = true; await tv("AddTV", f); f.added = true; e.target.replaceWith(el("span", { class: "muted small" }, tr("set.added"))); await load(); }) }, tr("set.add")))))) : "");
  } finally {
    $("#scan").disabled = false;
  }
});

$("#uninstall").onclick = () => safe(async () => {
  if (!confirm(tr("gen.uninstallConfirm"))) return;
  await tv("Uninstall");
});
$("#quit").onclick = () => tv("Quit");
$("#repo").onclick = e => { e.preventDefault(); tv("OpenRepo"); };

// Refresh online dots without disturbing inputs being edited.
Events.On("state", ev => {
  if (!state) return;
  for (const t of ev.data) state.online[t.mac] = t.online;
  document.querySelectorAll("#tvs .card").forEach((card, i) => {
    const t = state.config.tvs[i];
    const dot = card.querySelector(".dot");
    if (t && dot) dot.className = "dot" + (state.online[t.mac] ? " on" : "");
  });
});
window.addEventListener("focus", () => { if (!document.activeElement || document.activeElement === document.body) safe(load); });
safe(load);
</script>
</body>
</html>
