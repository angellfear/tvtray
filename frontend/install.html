<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TvTray</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; height: 100vh; }
  .head { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 18px; margin: 0; flex: 1; }
  p { margin: 0; color: var(--muted); }
  .path { display: flex; gap: 8px; }
  .path input { flex: 1; }
  .buttons { margin-top: auto; display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
  <div class="head">
    <h1 data-i18n="inst.heading"></h1>
    <select id="lang" aria-label="Language"></select>
  </div>
  <p data-i18n="inst.text"></p>
  <div class="path">
    <input type="text" id="dir" spellcheck="false">
    <button id="browse" data-i18n="inst.browse"></button>
  </div>
  <label class="check"><input type="checkbox" id="autostart" checked> <span data-i18n="inst.autostart"></span></label>
  <div class="error" id="err"></div>
  <div class="buttons">
    <button id="portable" data-i18n="inst.portable" data-i18n-title="inst.portableTitle"></button>
    <button id="cancel" data-i18n="inst.cancel"></button>
    <button class="primary" id="install" data-i18n="inst.install"></button>
  </div>
<script type="module">
import { installer, $, el } from "/common.js";
import { initI18n, setLang, getLang, LANGUAGES } from "/i18n.js";

await initI18n(() => installer("Language"), { reloadOnChange: false });
const sel = $("#lang");
sel.replaceChildren(...LANGUAGES.map(l => el("option", { value: l.code }, l.name)));
sel.value = getLang();
sel.onchange = () => {
  setLang(sel.value);
  installer("SetLanguage", sel.value);
};

const d = await installer("Defaults");
$("#dir").value = d.dir;

const busy = on => document.querySelectorAll("button, select").forEach(b => b.disabled = on);
const run = async fn => {
  $("#err").textContent = "";
  busy(true);
  try { await fn(); } catch (e) { $("#err").textContent = e?.message ?? String(e); busy(false); }
};

$("#browse").onclick = async () => {
  const p = await installer("Browse", $("#dir").value).catch(() => "");
  if (p) {
    const sep = p.includes("/") ? "/" : "\\";
    $("#dir").value = p.replace(/[\\/]tvtray$/i, "") + sep + (sep === "/" ? "tvtray" : "TvTray");
  }
};
$("#install").onclick = () => run(() => installer("Install", $("#dir").value, $("#autostart").checked, getLang()));
$("#portable").onclick = () => run(() => installer("Portable", $("#autostart").checked, getLang()));
$("#cancel").onclick = () => installer("Quit");
</script>
</body>
</html>
