<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>TvTray</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { overflow: hidden; }
  body { padding: 8px; width: max-content; }
  .remote { display: flex; flex-direction: column; gap: 6px; width: 196px; }
  .grid { display: grid; gap: 4px; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g4 { grid-template-columns: repeat(4, 1fr); }
  .remote button { padding: 4px 2px; font-size: 11px; min-width: 0; border-radius: 5px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 34px); gap: 4px; justify-content: center; }
  .remote .dpad button { font-size: 14px; padding: 0; }
  .remote .dpad .ok { border-radius: 50%; font-size: 12px; font-weight: 600; }
  .rocker { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .rocker > div { display: grid; grid-template-columns: 1fr auto 1fr; gap: 4px; align-items: center; }
  .rocker span { font-size: 10px; color: var(--muted); }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .top b { font-size: 12px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .remote .power { color: var(--danger); padding: 3px 8px; }
  .remote .dbl { letter-spacing: -3px; }
</style>
</head>
<body>
<div class="remote" data-i18n-title="remote.hint">
  <div class="top">
    <span class="row"><span class="dot" id="dot"></span><b id="name">TV</b></span>
    <button class="power" data-power data-i18n-title="remote.power"></button>
  </div>

  <div class="grid g4">
    <button data-key="KEY_SOURCE">Source</button>
    <button data-key="KEY_HOME">Home</button>
    <button data-key="KEY_MENU">Menu</button>
    <button data-key="KEY_INFO">Info</button>
  </div>

  <div class="dpad">
    <span></span><button data-key="KEY_UP">▲</button><span></span>
    <button data-key="KEY_LEFT">◀</button><button class="ok" data-key="KEY_ENTER">OK</button><button data-key="KEY_RIGHT">▶</button>
    <span></span><button data-key="KEY_DOWN">▼</button><span></span>
  </div>

  <div class="grid g3">
    <button data-key="KEY_RETURN" data-i18n="key.back"></button>
    <button data-key="KEY_TOOLS">Tools</button>
    <button data-key="KEY_EXIT">Exit</button>
  </div>

  <div class="rocker">
    <div><button data-key="KEY_VOLDOWN">－</button><span>Vol</span><button data-key="KEY_VOLUP">＋</button></div>
    <div><button data-key="KEY_CHDOWN">▼</button><span>Ch</span><button data-key="KEY_CHUP">▲</button></div>
  </div>

  <div class="grid g4">
    <button data-key="KEY_MUTE">Mute</button>
    <button data-key="KEY_REWIND" class="dbl">◀◀</button>
    <button data-key="KEY_PLAY">▶</button>
    <button data-key="KEY_PAUSE">⏸</button>
    <button data-key="KEY_STOP">⏹</button>
    <button data-key="KEY_FF" class="dbl">▶▶</button>
    <button data-key="KEY_PRECH">Pre-Ch</button>
    <button data-key="KEY_GUIDE">Guide</button>
  </div>

  <div class="grid g4">
    <button data-key="KEY_1">1</button><button data-key="KEY_2">2</button><button data-key="KEY_3">3</button><button data-key="KEY_4">4</button>
    <button data-key="KEY_5">5</button><button data-key="KEY_6">6</button><button data-key="KEY_7">7</button><button data-key="KEY_8">8</button>
    <button data-key="KEY_9">9</button><button data-key="KEY_0">0</button><button data-key="KEY_HDMI">HDMI</button><button data-key="KEY_CH_LIST">List</button>
  </div>
</div>
<script type="module">
import { tv, Events, $, safe, powerIcon } from "/common.js";
import { initI18n } from "/i18n.js";

await initI18n(() => tv("Language"));
$("[data-power]").innerHTML = powerIcon;

const mac = new URLSearchParams(location.search).get("mac");
const send = key => safe(() => tv("Key", mac, key));

document.querySelectorAll("[data-key]").forEach(b => b.addEventListener("click", () => send(b.dataset.key)));
$("[data-power]").onclick = () => safe(() => tv("Power", mac));

const keymap = {
  ArrowUp: "KEY_UP", ArrowDown: "KEY_DOWN", ArrowLeft: "KEY_LEFT", ArrowRight: "KEY_RIGHT",
  Enter: "KEY_ENTER", Backspace: "KEY_RETURN", Escape: "KEY_EXIT",
  "+": "KEY_VOLUP", "=": "KEY_VOLUP", "-": "KEY_VOLDOWN", m: "KEY_MUTE", h: "KEY_HOME",
  PageUp: "KEY_CHUP", PageDown: "KEY_CHDOWN",
};
document.addEventListener("keydown", e => {
  const k = keymap[e.key] ?? (/^[0-9]$/.test(e.key) ? "KEY_" + e.key : null);
  if (k) { e.preventDefault(); send(k); }
});

function show(list) {
  const t = list.find(x => x.mac === mac);
  if (!t) return;
  $("#name").textContent = t.name || t.model;
  $("#dot").className = "dot" + (t.online ? " on" : "");
}
Events.On("state", ev => show(ev.data));
tv("Settings").then(s => show(s.config.tvs.map(t => ({ ...t, online: s.online[t.mac] }))));

// Size the window to the content (no scrollbars at any DPI).
let fits = 0; // a few passes settle DPI rounding; never loop forever
function fit() {
  if (++fits > 4) return;
  const r = document.body.getBoundingClientRect();
  const cw = Math.ceil(r.width), ch = Math.ceil(r.height);
  if (Math.abs(window.innerWidth - cw) > 1 || Math.abs(window.innerHeight - ch) > 1) {
    tv("FitWindow", "remote-" + mac, cw, ch, window.innerWidth, window.innerHeight);
  }
}
requestAnimationFrame(fit);
window.addEventListener("resize", () => setTimeout(fit, 50));
</script>
</body>
</html>
